verify.text=SHA256SUMS enthält den SHA-256-Hashwert jeder Datei des Pakets. Führen Sie im entpackten Ordner „sha256sum -c SHA256SUMS“ aus: jede Zeile muss mit OK enden. Der Hashwert von SHA256SUMS selbst wird beim Export in das Prüfprotokoll von Aleruan Deal OS geschrieben, sodass eine spätere Änderung jeder Datei erkennbar ist.
