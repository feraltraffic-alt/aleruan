verify.text=SHA256SUMS lists the SHA-256 hash of every file in the package. Run "sha256sum -c SHA256SUMS" in the unpacked folder: every line must say OK. The hash of SHA256SUMS itself is written into the audit log of Aleruan Deal OS when the package is exported, so a later change to any file can be detected.
