spring:
  application:
    name: aleruan-deal-os
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dealos}
    username: ${DB_USER:dealos}
    password: ${DB_PASSWORD:dealos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/aleruan}

dealos:
  security:
    enabled: true
  sanctions:
    url: ${DEALOS_SANCTIONS_URL:}   # EU FSF XML link with your personal token; empty = disabled
  company:   # supplier details printed on quotes; override with DEALOS_COMPANY_* variables
    name: ${DEALOS_COMPANY_NAME:Aleruan-industry s.r.o.}
    country: CZ
    company-id: "14220997"
    vat-number: CZ14220997
    address: ${DEALOS_COMPANY_ADDRESS:Malešická 2855/2b, 130 00 Praha 3}
    email: ${DEALOS_COMPANY_EMAIL:}
    phone: ${DEALOS_COMPANY_PHONE:}
    web: ${DEALOS_COMPANY_WEB:}
    bank-name: ${DEALOS_COMPANY_BANK:PKO Bank Polski}
    iban: ${DEALOS_COMPANY_IBAN:PL23102010130000020204812139}
    swift: ${DEALOS_COMPANY_SWIFT:BPKOPLPW}
  quotes:
    valid-days: 30
  deals:
    margin-warning-pct: ${DEALOS_MARGIN_WARNING_PCT:10}   # warn when the deal margin on price drops below this
  registry:
    timeout: 5s
    vies:
      requester-country: CZ
      requester-number: "14220997"   # Aleruan-industry s.r.o., DIČ CZ14220997

management:
  endpoints:
    web:
      exposure:
        include: health,info
